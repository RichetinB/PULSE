[package]
name = "pulse-desktop"
version = "0.1.0"
description = "PULSE desktop application"
authors = ["PULSE contributors"]
edition = "2021"

[lib]
name = "pulse_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pulse-replay = { path = "../../../crates/pulse-replay" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.4.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
