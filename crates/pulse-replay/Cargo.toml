[package]
name = "pulse-replay"
version = "0.1.0"
description = "Bounded parser for classic osu!standard .osr replay files"
edition = "2021"

[dependencies]
chrono = { version = "0.4.45", features = ["clock"] }
md-5 = "0.10.6"
liblzma = "0.4.9"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"

[dev-dependencies]
serde_json = "1.0.145"
